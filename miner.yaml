version: "1"
kind: miner
protocol: generic
id: 774921
slug: verireceipt
name: VeriReceipt Deterministic Oracle
description: 'Zero-LLM deterministic provider with a SHA-256 receipt on every answer (raw_response_sha256:
  64 lowercase hex characters, no 0x prefix, over the exact evidence bytes served at /receipts/{receipt_id}/raw):
  seven named EVM transaction chains, SEC EDGAR filing counts by company, exact form and inclusive filing-date
  period, DeFiLlama protocol or chain TVL, a canonical fixed-size Ethereum mainnet ETH/USDC execution quote,
  supported CAISO/NYISO/Elering grid prices, and finalized-root Ethereum validator effective balances. Unsupported,
  ambiguous or unavailable evidence is refused rather than guessed. Additional receipt-backed endpoints provide
  named-chain gas and balances, explicit-chain ERC20 supply, World Bank unemployment, DNS record observations,
  dated currency conversion, TLS certificate validity and DNS response status. Thirty-one further receipt-backed
  endpoints provide academic search, Chainlink reserve attestations, GitHub CI patch verification, SEC corporate
  registry lookup, cross-chain transaction-state agreement, CVE records, resolved prediction-market outcomes, market
  data, current FX rates, IP geolocation, pool liquidity, malware and threat-intelligence blocklist reads, news
  headlines and search, card BIN lookup, driving ETAs, sanctions screening, delivered-uptime reads, sports scores,
  US equity quotes, token holder counts, transaction risk reads, US airport disruption status, URL safety reads, EU
  VAT verification, CVE triage and weather forecasts. Declared source, scope and
  freshness limits apply.'
base_url: https://verireceipt.onrender.com

auth:
  type: none

cache_ttl_sec: 10
rate_limit_per_sec: 20
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  website: https://verireceipt.vercel.app
  documentation: https://verireceipt.vercel.app/docs
  repository: https://github.com/mohamedwael201193/verireceipt

limitations:
  - code: MAX_PARAM_SIZE
    message: entity must not exceed 512 characters.
    param: entity
    property: length
    value_num: 512
    operator: lte
  - code: MAX_PARAM_SIZE
    message: protocol must not exceed 512 characters.
    param: protocol
    property: length
    value_num: 512
    operator: lte
  - code: MAX_PARAM_VALUE
    message: validator_index must be at most 1000000000.
    param: validator_index
    property: value
    value_num: 1000000000
    operator: lte

errors:
  message_path: message
  code_path: code

semantics:
  supported_intents:
    - ONCHAIN_TX_LOOKUP_GENERAL
    - REGULATORY_FILING_MONITOR_GENERAL
    - TVL_LOOKUP_GENERAL
    - OPTIMAL_EXECUTION_ROUTE_GENERAL
    - GRID_POWER_PRICE_GENERAL
    - VALIDATOR_PERFORMANCE_VERIFY_GENERAL
    - GAS_PRICE_GENERAL
    - WALLET_BALANCE_CHECK_GENERAL
    - TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL
    - MACRO_ECONOMIC_INDICATOR_GENERAL
    - DNS_RECORD_LOOKUP_GENERAL
    - CURRENCY_EXCHANGE_CONVERT
    - SSL_VERIFICATION_CERT
    - EMAIL_SECURITY_GENERAL
    - ACADEMIC_SEARCH_GENERAL
    - ASSET_RESERVE_ATTESTATION_GENERAL
    - CODE_PATCH_VERIFY_GENERAL
    - CORPORATE_REGISTRY_LOOKUP_GENERAL
    - CROSS_CHAIN_STATE_VERIFY_GENERAL
    - CRYPTO_PRICE_USD
    - CVE_LOOKUP_CVSS
    - EVENT_OUTCOME_RESOLUTION_GENERAL
    - FINANCIAL_DATA_GENERAL
    - FX_NOW_CAD
    - FX_NOW_EUR
    - FX_NOW_SEK
    - IP_GEOLOCATION_GENERAL
    - LIQUIDITY_DEPTH_VERIFY_GENERAL
    - MALWARE_DETECTION_HASH
    - MINING_HASHPRICE_VERIFY_GENERAL
    - NEWS_HEADLINES_GENERAL
    - NEWS_SEARCH_GENERAL
    - PAYMENT_METHOD_VERIFY_GENERAL
    - ROUTE_ETA_GENERAL
    - SANCTIONS_SCREENING_MATCH_GENERAL
    - SLA_COMPLIANCE_GENERAL
    - SPORTS_SCORE_GENERAL
    - STORM_ALERT_GENERAL
    - STOCK_PRICE_US_EQUITY
    - THREAT_INTELLIGENCE_INDICATOR
    - TOKEN_HOLDER_COUNT_GENERAL
    - TRANSACTION_RISK_GENERAL
    - TRAVEL_DISRUPTION_GENERAL
    - URL_SAFE_GENERAL
    - URL_SCAN_VERDICT
    - VENDOR_VERIFY_GENERAL
    - VULNERABILITY_TRIAGE_GENERAL
    - WEATHER_CHECK_TEMPERATURE
    - WEATHER_FORECAST_GENERAL
  signal_mapping:
    confidence_field: confidence
    label_field: answer
    reason_field: source

endpoints:
  - path: /v1/tx
    external_path: /v1/tx
    method: GET
    description: Looks up one complete EVM transaction hash on an explicitly named supported chain using a public
      archive-capable RPC quorum. Returns tx_hash, status (confirmed, reverted, pending or not_found), from,
      to, block_number, value_eth and a SHA-256 receipt. A quorum is required; an unavailable or conflicting
      source set is not a not_found answer. This is an observation, not a transaction submission.
    intents:
    - ONCHAIN_TX_LOOKUP_GENERAL
    params:
      query:
        required:
        - name: tx_hash
          type: string
          intents:
          - ONCHAIN_TX_LOOKUP_GENERAL
          description: Complete 0x-prefixed 64-hex-character transaction hash.
        - name: chain
          type: string
          intents:
          - ONCHAIN_TX_LOOKUP_GENERAL
          description: 'Supported canonical chain names: ethereum, base, arbitrum, optimism, polygon, sepolia
            and base-sepolia. Ethereum aliases eth and mainnet are accepted. State the chain explicitly; do
            not infer another chain from a transaction hash.'

  - path: /v1/filings
    external_path: /v1/filings
    method: GET
    description: Counts one company's SEC EDGAR submissions by inclusive filing_date, optionally restricted
      to one exact form type. Supports calendar years, explicit calendar quarters, valid quarter-ending dates
      and explicit date ranges, not company fiscal periods. Returns entity, form_type, filing_count, newest-first
      filing titles and URLs, and a SHA-256 receipt. Unknown or ambiguous company/form and unsupported periods
      are refused, not replaced with an unfiltered count or another source.
    intents:
    - REGULATORY_FILING_MONITOR_GENERAL
    params:
      query:
        required:
        - name: entity
          type: string
          intents:
          - REGULATORY_FILING_MONITOR_GENERAL
          description: The subject of the question verbatim, including any SEC form type and CIK, e.g. "Form
            10-Q filings by Tesla, Inc. (CIK 1318605)", "Tesla, Inc.", "TSLA", "1318605".
        - name: period
          type: string
          intents:
          - REGULATORY_FILING_MONITOR_GENERAL
          description: 'An inclusive filing-date period: last N months, a calendar year, year to date
            (YTD, January 1 of the current calendar year through today), an explicit calendar
            Q1/Q2/Q3/Q4 with year (e.g. "Q3 2026"), a valid quarter ending YYYY-MM-DD (March 31, June 30, September 30 or December
            31), YYYY-MM-DD..YYYY-MM-DD, or a supported year/date range using to or through. Bare Q1-Q4 without
            calendar qualification and company fiscal-year or fiscal-quarter requests are rejected.'
        optional:
        - name: form_type
          type: string
          intents:
          - REGULATORY_FILING_MONITOR_GENERAL
          description: One exact SEC EDGAR form type as asked, including slash amendments, e.g. 10-K, 10-Q,
            8-K, 144/A or 4/A. 10-K excludes 10-K/A and amendments are not folded into originals. A form embedded
            in entity is retained; conflicting form specifications are rejected. Omit only when the question
            asks for all forms.

  - path: /v1/tvl
    external_path: /v1/tvl
    method: GET
    description: Returns current DeFiLlama TVL in USD for one resolvable protocol, catalog parent aggregate
      or chain. Version-qualified names remain version-qualified; catalog parent relationships are not replaced
      by guessed slug substitutions. Returns protocol_or_chain, tvl_usd, as_of and a SHA-256 receipt. chain_tvl_usd
      is an optional nullable breakdown, not a second required total. Unknown or ambiguous identities are refused.
    intents:
    - TVL_LOOKUP_GENERAL
    params:
      query:
        required:
        - name: protocol
          type: string
          intents:
          - TVL_LOOKUP_GENERAL
          description: Protocol name or DeFiLlama slug, preserving any requested version, catalog parent name,
            or supported chain name. Use the complete identity from the question, at most 512 characters. A
            protocol parent aggregate is not interchangeable with one child version; a missing optional chain
            breakdown does not mean the total is missing.

  - path: /v1/route
    external_path: /v1/route
    method: GET
    description: The typed intent contract quotes exactly 1 ETH sold for USDC on Ethereum mainnet, with block-pinned
      public RPC evidence and amount_out in USDC base units (6 decimals). Compares implemented Uniswap V2/V3
      and SushiSwap V2 venues. The API separately implements native ETH/USDT, DAI/USDC, USDT/USDC, DAI/USDT
      and WBTC/USDC extensions, each selling one whole input token with output in its actual buy-token base
      units. Those extensions are outside this typed canonical contract and its accepted_fields; native amounts
      are never inflated into the canonical range or relabelled as another token. Quotes are gross, not gas-adjusted;
      no cross-chain, arbitrary-size or arbitrary-pair routing is promised.
    intents:
    - OPTIMAL_EXECUTION_ROUTE_GENERAL
    params:
      query:
        required:
        - name: pair
          type: string
          intents:
          - OPTIMAL_EXECUTION_ROUTE_GENERAL
          description: 'Typed canonical intent pair: ETH/USDC only, selling exactly 1 ETH for USDC on Ethereum
            mainnet. Separately implemented native API extension pairs are not accepted values for this typed
            contract.'
          accepted_fields:
            ETH/USDC:
              intents:
              - OPTIMAL_EXECUTION_ROUTE_GENERAL
              description: Sell exactly 1 ETH for USDC on Ethereum mainnet; amount_out is USDC base units (6 decimals).
  - path: /v1/grid-price
    external_path: /v1/grid-price
    method: GET
    description: Returns lmp_usd_per_mwh for a supported pricing node or zone and a finished UTC interval from
      CAISO OASIS day-ahead hourly LMP, NYISO real-time 5-minute zonal LBMP, or Elering cached published price
      rows converted from EUR/MWh with the recorded EUR/USD source. Returns node_or_zone, market, interval_start,
      currency, checked_at and receipt timestamps, not a separate freshness/finality field. Normal valid cache
      rows, including eligible provisional rows, use verdict=verified and confidence=1 without a provisional
      label. An unconfirmed post-close row after failed revalidation or unavailable historical re-fetch instead
      carries the unverified-cached-price warning in the answer. Elering is cache-only; absent evidence is not
      interpolated or invented. A finished interval is not a promise of final settlement.
    intents:
    - GRID_POWER_PRICE_GENERAL
    params:
      query:
        required:
        - name: node_or_zone
          type: string
          intents:
          - GRID_POWER_PRICE_GENERAL
          description: CAISO hubs TH_NP15_GEN-APND, TH_SP15_GEN-APND or TH_ZP26_GEN-APND (NP15, SP15, ZP26 aliases);
            bare CAISO explicitly selects NP15. NYISO zones ZONE_A..ZONE_K or supported NYISO names, including
            WEST and N.Y.C.; source-qualified NYISO WEST is accepted. Elering zones EE, FI, LV, LT, also source-qualified
            as Elering EE, Elering FI, Elering LV or Elering LT. Other market/zone combinations are refused.
        - name: interval_start
          type: string
          intents:
          - GRID_POWER_PRICE_GENERAL
          description: 'Exact finished settlement-interval start in ISO-8601 UTC with Z or +00:00, aligned to
            the selected market: CAISO 60 minutes, NYISO 5 minutes, Elering 15-minute accepted keys. An aligned
            key is not proof that a source row exists; do not shift an absent interval or infer a current/historical
            price.'

  - path: /v1/validator
    external_path: /v1/validator
    method: GET
    description: Returns effective_balance in gwei and status for one Ethereum beacon validator, bound to an
      agreed finalized_state_root. At least two configured public beacon sources must agree on the finalized
      root and at least two validator responses must agree on effective_balance/status for that root. Any returned
      dissent or found-versus-404 conflict fails closed; unavailable legs do not become votes. Verified answers
      may be reused only for the same validator and agreed finalized root, with their original receipt. This
      is effective balance, not APY, reward income, uptime or slashing history.
    intents:
    - VALIDATOR_PERFORMANCE_VERIFY_GENERAL
    params:
      query:
        required:
        - name: validator_index
          type: string
          intents:
          - VALIDATOR_PERFORMANCE_VERIFY_GENERAL
          description: Ethereum beacon-chain validator index as a canonical decimal digit string (0, or a non-negative
            integer with no sign and no leading zeros), e.g. 1, at most 1000000000 (the official intent max).
            The handler rejects any other shape.

  - path: /v1/gas-price
    external_path: /v1/gas-price
    method: GET
    description: Returns current gas_price_gwei on an explicitly named supported EVM chain from public RPC
      quorum, with stored source evidence.
    intents:
    - GAS_PRICE_GENERAL
    params:
      query:
        required:
        - name: chain
          type: string
          intents:
          - GAS_PRICE_GENERAL
          description: Copy the requested chain without inventing or silently defaulting identity or scope.
  - path: /v1/balance
    external_path: /v1/balance
    method: GET
    description: Returns a finalized native or ERC20 balance in whole token units for an explicit address
      and supported chain. Optional token selects the asset; absent token means the native asset. No transaction
      is sent.
    intents:
    - WALLET_BALANCE_CHECK_GENERAL
    params:
      query:
        required:
        - name: address
          type: string
          intents:
          - WALLET_BALANCE_CHECK_GENERAL
          description: Copy the requested address without inventing or silently defaulting identity or scope.
        - name: chain
          type: string
          intents:
          - WALLET_BALANCE_CHECK_GENERAL
          description: Copy the requested chain without inventing or silently defaulting identity or scope.
        optional:
        - name: token
          type: string
          intents:
          - WALLET_BALANCE_CHECK_GENERAL
          description: Copy the requested token without inventing or silently defaulting identity or scope.
  - path: /v1/token-supply
    external_path: /v1/token-supply
    method: GET
    description: Returns ERC20 total_supply in whole tokens from finalized-tag RPC quorum. The token text
      must preserve explicit chain and contract identity, for example a token followed by on and the named
      chain. Does not infer a chain for an ambiguous symbol.
    intents:
    - TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL
    params:
      query:
        required:
        - name: token
          type: string
          intents:
          - TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL
          description: Copy the complete token string, keeping any explicit chain, contract address and
            display label. Do not invent a chain.
  - path: /v1/macro
    external_path: /v1/macro
    method: GET
    description: Returns World Bank SL.UEM.TOTL.ZS unemployment rate_pct for a country and optional calendar
      year. Omitted year uses latest published nonempty annual data; missing explicit-year data is refused.
      Other economic indicators are not supported.
    intents:
    - MACRO_ECONOMIC_INDICATOR_GENERAL
    params:
      query:
        required:
        - name: indicator
          type: string
          intents:
          - MACRO_ECONOMIC_INDICATOR_GENERAL
          description: Copy the requested indicator without inventing or silently defaulting identity or
            scope.
          accepted_fields:
            unemployment rate:
              intents:
              - MACRO_ECONOMIC_INDICATOR_GENERAL
              description: Supported canonical value.
        - name: country
          type: string
          intents:
          - MACRO_ECONOMIC_INDICATOR_GENERAL
          description: Copy the requested country without inventing or silently defaulting identity or scope.
        optional:
        - name: year
          type: integer
          intents:
          - MACRO_ECONOMIC_INDICATOR_GENERAL
          description: Optional explicit calendar year. Preserve the requested year; omit only when no year
            was requested.
  - path: /v1/dns
    external_path: /v1/dns
    method: GET
    description: Returns has_record for one DNS name and one of the ten declared record types from recursive
      resolver observations. Inconclusive failures and existence disagreement are refused, not reported
      as absence.
    intents:
    - DNS_RECORD_LOOKUP_GENERAL
    params:
      query:
        required:
        - name: name
          type: string
          intents:
          - DNS_RECORD_LOOKUP_GENERAL
          description: Copy the requested name without inventing or silently defaulting identity or scope.
        - name: record_type
          type: string
          intents:
          - DNS_RECORD_LOOKUP_GENERAL
          description: Copy the requested record_type without inventing or silently defaulting identity
            or scope.
          accepted_fields:
            A:
              intents:
              - DNS_RECORD_LOOKUP_GENERAL
              description: Supported canonical value.
            AAAA:
              intents:
              - DNS_RECORD_LOOKUP_GENERAL
              description: Supported canonical value.
            CNAME:
              intents:
              - DNS_RECORD_LOOKUP_GENERAL
              description: Supported canonical value.
            MX:
              intents:
              - DNS_RECORD_LOOKUP_GENERAL
              description: Supported canonical value.
            NS:
              intents:
              - DNS_RECORD_LOOKUP_GENERAL
              description: Supported canonical value.
            TXT:
              intents:
              - DNS_RECORD_LOOKUP_GENERAL
              description: Supported canonical value.
            SOA:
              intents:
              - DNS_RECORD_LOOKUP_GENERAL
              description: Supported canonical value.
            CAA:
              intents:
              - DNS_RECORD_LOOKUP_GENERAL
              description: Supported canonical value.
            SRV:
              intents:
              - DNS_RECORD_LOOKUP_GENERAL
              description: Supported canonical value.
            PTR:
              intents:
              - DNS_RECORD_LOOKUP_GENERAL
              description: Supported canonical value.
  - path: /v1/fx
    external_path: /v1/fx
    method: GET
    description: Returns converted_amount in the requested to_currency using dated daily public rate sources
      and disclosed agreement or degraded coverage, not a live trading quote.
    intents:
    - CURRENCY_EXCHANGE_CONVERT
    params:
      query:
        required:
        - name: from_currency
          type: string
          intents:
          - CURRENCY_EXCHANGE_CONVERT
          description: Copy the requested from_currency without inventing or silently defaulting identity
            or scope.
        - name: to_currency
          type: string
          intents:
          - CURRENCY_EXCHANGE_CONVERT
          description: Copy the requested to_currency without inventing or silently defaulting identity
            or scope.
        optional:
        - name: amount
          type: number
          intents:
          - CURRENCY_EXCHANGE_CONVERT
          description: Copy the requested amount without inventing or silently defaulting identity or scope.
  - path: /v1/ssl
    external_path: /v1/ssl
    method: GET
    description: Returns certificate_valid from an actual TLS certificate and hostname/trust-store check
      on an allowed public hostname. Network failure is refused. No revocation or multi-vantage assurance
      is claimed.
    intents:
    - SSL_VERIFICATION_CERT
    params:
      query:
        required:
        - name: host
          type: string
          intents:
          - SSL_VERIFICATION_CERT
          description: Copy the requested host without inventing or silently defaulting identity or scope.
  - path: /v1/email-security
    external_path: /v1/email-security
    method: GET
    description: Returns lookup_ok for a public DNS response status for one domain/name and record type.
      It does not report record presence, email safety or deliverability; NOERROR can have no matching records.
    intents:
    - EMAIL_SECURITY_GENERAL
    params:
      query:
        required:
        - name: domain
          type: string
          intents:
          - EMAIL_SECURITY_GENERAL
          description: Copy the requested domain without inventing or silently defaulting identity or scope.
        - name: record_type
          type: string
          intents:
          - EMAIL_SECURITY_GENERAL
          description: Copy the requested record_type without inventing or silently defaulting identity
            or scope.

  - path: /v1/academic-search
    external_path: /v1/academic-search
    method: GET
    description: Searches the Crossref scholarly index for works matching a topic and returns the top
      titles with their DOIs, with a SHA-256 receipt over the exact upstream body.
    intents:
    - ACADEMIC_SEARCH_GENERAL
    params:
      query:
        required:
        - name: query
          type: string
          intents:
          - ACADEMIC_SEARCH_GENERAL
          description: Topic or question to search scholarly papers for

  - path: /v1/reserve-attestation
    external_path: /v1/reserve-attestation
    method: GET
    description: The latest Chainlink Proof-of-Reserve attestation for a supported asset, read on
      ethereum mainnet through the RPC quorum, with a SHA-256 receipt.
    intents:
    - ASSET_RESERVE_ATTESTATION_GENERAL
    params:
      query:
        required:
        - name: asset
          type: string
          intents:
          - ASSET_RESERVE_ATTESTATION_GENERAL
          description: "The tokenized asset: its symbol or contract address"

  - path: /v1/code-patch
    external_path: /v1/code-patch
    method: GET
    description: "Verifies a GitHub patch by reading its real CI results from the GitHub API: check runs plus the combined commit status for the exact ref. GitHub patches only."
    intents:
    - CODE_PATCH_VERIFY_GENERAL
    params:
      query:
        required:
        - name: patch
          type: string
          intents:
          - CODE_PATCH_VERIFY_GENERAL
          description: Repository and commit, pull request or CI run to check

  - path: /v1/corporate-registry
    external_path: /v1/corporate-registry
    method: GET
    description: Looks up a US public company in the SEC's EDGAR registry, the only jurisdiction this
      endpoint covers. Active means a filing within the last 400 days.
    intents:
    - CORPORATE_REGISTRY_LOOKUP_GENERAL
    params:
      query:
        required:
        - name: company
          type: string
          intents:
          - CORPORATE_REGISTRY_LOOKUP_GENERAL
          description: Company name or registry identifier
        - name: jurisdiction
          type: string
          intents:
          - CORPORATE_REGISTRY_LOOKUP_GENERAL
          description: Country or jurisdiction of registration

  - path: /v1/cross-chain-state
    external_path: /v1/cross-chain-state
    method: GET
    description: Resolves one transaction hash independently on each listed chain through the 2-of-N
      RPC quorum and reports per-chain agreement; disagreement is reported, never averaged.
    intents:
    - CROSS_CHAIN_STATE_VERIFY_GENERAL
    params:
      query:
        required:
        - name: reference
          type: string
          intents:
          - CROSS_CHAIN_STATE_VERIFY_GENERAL
          description: Address, transfer or transaction to check
        - name: chains
          type: string
          intents:
          - CROSS_CHAIN_STATE_VERIFY_GENERAL
          description: Source and destination chains

  - path: /v1/cve
    external_path: /v1/cve
    method: GET
    description: The published CVSS v3.1 assessment for a CVE from the CVE record, with assessor,
      version and vector disclosed. NVD is opt-in only and off by default.
    intents:
    - CVE_LOOKUP_CVSS
    params:
      query:
        required:
        - name: cve_id
          type: string
          intents:
          - CVE_LOOKUP_CVSS
          description: CVE identifier, e.g. CVE-2024-3094

  - path: /v1/event-outcome
    external_path: /v1/event-outcome
    method: GET
    description: "The resolved outcome of a prediction-market event from the Polymarket gamma API: closed and UMA-resolved binary Yes/No markets with a clean 1/0 price pair only. One venue's resolution record, not an independent determination of the underlying event."
    intents:
    - EVENT_OUTCOME_RESOLUTION_GENERAL
    params:
      query:
        required:
        - name: event
          type: string
          intents:
          - EVENT_OUTCOME_RESOLUTION_GENERAL
          description: The event or question to resolve

  - path: /v1/financial-data
    external_path: /v1/financial-data
    method: GET
    description: Market capitalisation and trading volume for a supported asset from named, keyless,
      measured sources, with a SHA-256 receipt over the exact upstream bodies.
    intents:
    - FINANCIAL_DATA_GENERAL
    params:
      query:
        required:
        - name: asset
          type: string
          intents:
          - FINANCIAL_DATA_GENERAL
          description: Company, token or market

  - path: /v1/fx-now
    external_path: /v1/fx-now
    method: GET
    description: The current CAD, EUR and SEK rates vs the US dollar from named keyless sources
      with quoted observation times, with a SHA-256 receipt.
    intents:
    - FX_NOW_CAD
    - FX_NOW_EUR
    - FX_NOW_SEK
    params:
      query:
        required:
        - name: currency
          type: string
          intents:
          - FX_NOW_CAD
          - FX_NOW_EUR
          - FX_NOW_SEK
          description: Currency code priced against the US dollar, one of CAD, EUR, SEK


  - path: /v1/ip-geolocation
    external_path: /v1/ip-geolocation
    method: GET
    description: Resolves an IP address to its approximate location from two keyless public
      geolocation services. Approximate network geography, not a physical address.
    intents:
    - IP_GEOLOCATION_GENERAL
    params:
      query:
        required:
        - name: ip
          type: string
          intents:
          - IP_GEOLOCATION_GENERAL
          description: IP address

  - path: /v1/liquidity
    external_path: /v1/liquidity
    method: GET
    description: Total reserve liquidity in USD for a named pool and chain from the pinned-block
      indexed observation, not executable depth at a slippage threshold.
    intents:
    - LIQUIDITY_DEPTH_VERIFY_GENERAL
    params:
      query:
        required:
        - name: pool
          type: string
          intents:
          - LIQUIDITY_DEPTH_VERIFY_GENERAL
          description: DEX pool address or name
        - name: chain
          type: string
          intents:
          - LIQUIDITY_DEPTH_VERIFY_GENERAL
          description: Chain of the pool

  - path: /v1/malware-hash
    external_path: /v1/malware-hash
    method: GET
    description: Whether a file hash, domain or IP is flagged as malicious by the named keyless
      threat-intelligence sources. Absence from a blocklist is not clearance, and an unknown hash is
      not a clean verdict.
    intents:
    - MALWARE_DETECTION_HASH
    params:
      query:
        required:
        - name: indicator
          type: string
          intents:
          - MALWARE_DETECTION_HASH
          description: Domain, IP address or file hash

  - path: /v1/news-headlines
    external_path: /v1/news-headlines
    method: GET
    description: The top headline for a topic from the two named indexes (Hacker News via Algolia,
      current BBC News World RSS) inside the requested window; no matching item is an honest refusal.
    intents:
    - NEWS_HEADLINES_GENERAL
    params:
      query:
        required:
        - name: topic
          type: string
          intents:
          - NEWS_HEADLINES_GENERAL
          description: Topic or region

  - path: /v1/news-search
    external_path: /v1/news-search
    method: GET
    description: A deterministic digest of what the two named news indexes carry for a query, with a
      SHA-256 receipt over the exact upstream bodies.
    intents:
    - NEWS_SEARCH_GENERAL
    params:
      query:
        required:
        - name: query
          type: string
          intents:
          - NEWS_SEARCH_GENERAL
          description: Topic, entity or event

  - path: /v1/payment-method
    external_path: /v1/payment-method
    method: GET
    description: Verifies a card BIN (bank identification number, the first 6-8 digits of a card
      number) against a public BIN database. A recognized BIN is not a card validity or funds check.
    intents:
    - PAYMENT_METHOD_VERIFY_GENERAL
    params:
      query:
        required:
        - name: bin
          type: integer
          intents:
          - PAYMENT_METHOD_VERIFY_GENERAL
          description: Card number prefix (BIN, the first 6 to 8 digits); a job's params are public,
            so never a full card number

  - path: /v1/route-eta
    external_path: /v1/route-eta
    method: GET
    description: Driving ETA between two coordinates from the public OSRM demo server, with a SHA-256
      receipt over the exact upstream response body.
    intents:
    - ROUTE_ETA_GENERAL
    params:
      query:
        required:
        - name: origin
          type: string
          intents:
          - ROUTE_ETA_GENERAL
          description: Start point
        - name: destination
          type: string
          intents:
          - ROUTE_ETA_GENERAL
          description: End point

  - path: /v1/sanctions-screen
    external_path: /v1/sanctions-screen
    method: GET
    description: Screens a person or entity name against two keyless public sanctions lists, the OFAC
      SDN list with its published aliases and a second named list. A non-match is not clearance.
    intents:
    - SANCTIONS_SCREENING_MATCH_GENERAL
    params:
      query:
        required:
        - name: name
          type: string
          intents:
          - SANCTIONS_SCREENING_MATCH_GENERAL
          description: Person or entity name

  - path: /v1/sla-compliance
    external_path: /v1/sla-compliance
    method: GET
    description: The delivered uptime for a named service over a period from its public status
      history. Where no machine-readable SLA target is published, sla_target_pct and compliant are
      null rather than guessed.
    intents:
    - SLA_COMPLIANCE_GENERAL
    params:
      query:
        required:
        - name: service
          type: string
          intents:
          - SLA_COMPLIANCE_GENERAL
          description: The service
        - name: period
          type: string
          intents:
          - SLA_COMPLIANCE_GENERAL
          description: Period to measure, e.g. last 30 days

  - path: /v1/sports-score
    external_path: /v1/sports-score
    method: GET
    description: The score of a game from the official league scoreboards for the dates searched (NHL
      and MLB). A game not found on those scoreboards is refused, not approximated.
    intents:
    - SPORTS_SCORE_GENERAL
    params:
      query:
        required:
        - name: game
          type: string
          intents:
          - SPORTS_SCORE_GENERAL
          description: Teams or fixture

  - path: /v1/stock-price
    external_path: /v1/stock-price
    method: GET
    description: The latest quote for a US-listed equity from the Yahoo Finance chart API, with a
      SHA-256 receipt over the exact upstream body.
    intents:
    - STOCK_PRICE_US_EQUITY
    params:
      query:
        required:
        - name: ticker
          type: string
          intents:
          - STOCK_PRICE_US_EQUITY
          description: Stock ticker, e.g. AAPL

  - path: /v1/threat-indicator
    external_path: /v1/threat-indicator
    method: GET
    description: Whether an IP, domain, URL or file hash appears on the named keyless public
      threat-intelligence blocklists. Absence from those lists is not clearance.
    intents:
    - THREAT_INTELLIGENCE_INDICATOR
    params:
      query:
        required:
        - name: indicator
          type: string
          intents:
          - THREAT_INTELLIGENCE_INDICATOR
          description: IP address, domain, hash, CVE or actor

  - path: /v1/token-holders
    external_path: /v1/token-holders
    method: GET
    description: The number of distinct addresses holding an ERC-20 token from a keyless public block
      indexer, with a SHA-256 receipt over the exact upstream body.
    intents:
    - TOKEN_HOLDER_COUNT_GENERAL
    params:
      query:
        required:
        - name: token
          type: string
          intents:
          - TOKEN_HOLDER_COUNT_GENERAL
          description: Token contract address or name
        - name: chain
          type: string
          intents:
          - TOKEN_HOLDER_COUNT_GENERAL
          description: Chain of the token

  - path: /v1/transaction-risk
    external_path: /v1/transaction-risk
    method: GET
    description: A deterministic, fully-disclosed risk read of an ethereum mainnet transaction from
      named in-repo-verified sources. A low score is not a safety guarantee.
    intents:
    - TRANSACTION_RISK_GENERAL
    params:
      query:
        required:
        - name: transaction
          type: string
          intents:
          - TRANSACTION_RISK_GENERAL
          description: Transaction hash or details

  - path: /v1/travel-disruption
    external_path: /v1/travel-disruption
    method: GET
    description: US airport-level disruption status from the FAA NAS status feed, with a SHA-256
      receipt over the exact upstream body.
    intents:
    - TRAVEL_DISRUPTION_GENERAL
    params:
      query:
        required:
        - name: route_or_flight
          type: string
          intents:
          - TRAVEL_DISRUPTION_GENERAL
          description: Flight, route or station

  - path: /v1/url-safe
    external_path: /v1/url-safe
    method: GET
    description: Safety verdict for a URL from the named keyless public threat-intelligence
      blocklists. Absence from those lists is not clearance.
    intents:
    - URL_SAFE_GENERAL
    params:
      query:
        required:
        - name: url
          type: string
          intents:
          - URL_SAFE_GENERAL
          description: The URL

  - path: /v1/url-scan
    external_path: /v1/url-scan
    method: GET
    description: Whether a URL is safe to visit, with no phishing or malware, per the named keyless
      blocklists screening the exact URL and its host. Absence from those lists is not clearance.
    intents:
    - URL_SCAN_VERDICT
    params:
      query:
        required:
        - name: url
          type: string
          intents:
          - URL_SCAN_VERDICT
          description: The URL

  - path: /v1/vendor-verify
    external_path: /v1/vendor-verify
    method: GET
    description: Verifies an EU VAT registration number against the European Commission's VIES
      service. A valid VAT number is not proof of the vendor's identity.
    intents:
    - VENDOR_VERIFY_GENERAL
    params:
      query:
        required:
        - name: vendor
          type: string
          intents:
          - VENDOR_VERIFY_GENERAL
          description: Vendor or company
        - name: vat_number
          type: string
          intents:
          - VENDOR_VERIFY_GENERAL
          description: VAT or tax identifier

  - path: /v1/vulnerability-triage
    external_path: /v1/vulnerability-triage
    method: GET
    description: "A deterministic triage read for a CVE from the published record: severity, vector and references, with a SHA-256 receipt."
    intents:
    - VULNERABILITY_TRIAGE_GENERAL
    params:
      query:
        required:
        - name: cve_id
          type: string
          intents:
          - VULNERABILITY_TRIAGE_GENERAL
          description: CVE identifier

  - path: /v1/weather-forecast
    external_path: /v1/weather-forecast
    method: GET
    description: Forecast high and low temperature, peak precipitation probability and dominant
      condition for a place over a forward window from the Open-Meteo API, with a SHA-256 receipt.
    intents:
    - WEATHER_FORECAST_GENERAL
    params:
      query:
        required:
        - name: location
          type: string
          intents:
          - WEATHER_FORECAST_GENERAL
          description: City or place name
        optional:
        - name: window_hours
          type: integer
          intents:
          - WEATHER_FORECAST_GENERAL
          description: Forecast window

  - path: /v1/crypto-price
    external_path: /v1/crypto-price
    method: GET
    description: Current USD spot price for one crypto symbol from the Coinbase public spot API,
      with a SHA-256 receipt. One named exchange's last spot quote, not an index or VWAP; symbols
      the source does not list are refused, never guessed.
    intents:
    - CRYPTO_PRICE_USD
    params:
      query:
        required:
        - name: symbol
          type: string
          intents:
          - CRYPTO_PRICE_USD
          description: Asset symbol, e.g. BTC

  - path: /v1/mining-hashprice
    external_path: /v1/mining-hashprice
    method: GET
    description: Bitcoin hashprice at the current tip computed from measured inputs (mempool.space
      1-week hashrate and per-block fee series, deterministic subsidy, Coinbase spot), with a SHA-256
      receipt. A spot value from current measured series, never a forecast; a block_height other
      than the current tip is an honest refusal, not an interpolated answer.
    intents:
    - MINING_HASHPRICE_VERIFY_GENERAL
    params:
      query:
        optional:
        - name: block_height
          type: integer
          intents:
          - MINING_HASHPRICE_VERIFY_GENERAL
          description: Bitcoin block height; only the current tip is served

  - path: /v1/storm-alert
    external_path: /v1/storm-alert
    method: GET
    description: Storm risk for a US point over a forward window from issued NWS alert products only,
      with a SHA-256 receipt. The score is the worst severity among active issued products expiring
      inside the window; no forecast model output is scored, and peak gust and precipitation numerics
      are not carried by issued products. US coverage only.
    intents:
    - STORM_ALERT_GENERAL
    params:
      query:
        required:
        - name: location
          type: string
          intents:
          - STORM_ALERT_GENERAL
          description: Point as latitude,longitude (US coverage)
        optional:
        - name: window_hours
          type: integer
          intents:
          - STORM_ALERT_GENERAL
          description: Assessment window in hours, 1-240, default 24

  - path: /v1/weather-check
    external_path: /v1/weather-check
    method: GET
    description: Measured air temperature for a place from the nearest NOAA aviationweather.gov METAR
      station, at most 90 minutes old, with a SHA-256 receipt. A measured station observation, not a
      forecast, reanalysis or city-wide value; the station binding is explicit in the evidence.
    intents:
    - WEATHER_CHECK_TEMPERATURE
    params:
      query:
        required:
        - name: location
          type: string
          intents:
          - WEATHER_CHECK_TEMPERATURE
          description: City or place name, or latitude,longitude

