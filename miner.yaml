version: "1"
kind: miner
protocol: generic
id: 774921
slug: verireceipt
name: VeriReceipt Deterministic Oracle
description: >-
  Zero-LLM deterministic provider with a SHA-256 receipt on every answer
  (raw_response_sha256: 64 lowercase hex characters, no 0x prefix, over the
  exact evidence bytes served at /receipts/{receipt_id}/raw): EVM
  transaction lookups (archive-RPC quorum), SEC
  EDGAR filing counts by company, form type and period, DeFi TVL
  (DeFiLlama), block-pinned 1 ETH -> USDC execution quotes on Ethereum
  mainnet, wholesale grid power prices (CAISO, NYISO, Elering), and Ethereum
  beacon-chain validator effective balances (2-of-4 beacon API quorum). It
  refuses (400/422/502/504) rather than guessing.
  Additional receipt-backed endpoints provide named-chain gas and balances, explicit-chain ERC20 supply, World Bank unemployment, DNS record observations, dated currency conversion, TLS certificate validity and DNS response status. Declared source, scope and freshness limits apply.
base_url: https://verireceipt.onrender.com

auth:
  type: none

cache_ttl_sec: 10
rate_limit_per_sec: 20
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  website: https://verireceipt.vercel.app
  documentation: https://verireceipt.vercel.app/docs
  repository: https://github.com/mohamedwael201193/verireceipt

limitations:
  - code: MAX_PARAM_SIZE
    message: entity must not exceed 512 characters.
    param: entity
    property: length
    value_num: 512
    operator: lte
  - code: MAX_PARAM_SIZE
    message: protocol must not exceed 512 characters.
    param: protocol
    property: length
    value_num: 512
    operator: lte
  - code: MAX_PARAM_VALUE
    message: validator_index must be at most 1000000000.
    param: validator_index
    property: value
    value_num: 1000000000
    operator: lte

errors:
  message_path: message
  code_path: code

semantics:
  supported_intents:
    - ONCHAIN_TX_LOOKUP_GENERAL
    - REGULATORY_FILING_MONITOR_GENERAL
    - TVL_LOOKUP_GENERAL
    - OPTIMAL_EXECUTION_ROUTE_GENERAL
    - GRID_POWER_PRICE_GENERAL
    - VALIDATOR_PERFORMANCE_VERIFY_GENERAL
    - GAS_PRICE_GENERAL
    - WALLET_BALANCE_CHECK_GENERAL
    - TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL
    - MACRO_ECONOMIC_INDICATOR_GENERAL
    - DNS_RECORD_LOOKUP_GENERAL
    - CURRENCY_EXCHANGE_CONVERT
    - SSL_VERIFICATION_CERT
    - EMAIL_SECURITY_GENERAL
  signal_mapping:
    confidence_field: confidence
    label_field: answer
    reason_field: source

endpoints:
  - path: /v1/tx
    external_path: /v1/tx
    method: GET
    description: >-
      Looks up one EVM transaction by hash on a named chain with a 2-of-N
      archive-RPC quorum and returns tx_hash, status (confirmed, reverted,
      pending, not_found), from, to, block_number, value_eth and a SHA-256
      receipt. Use for questions such as "In which block was transaction
      0x... included?".
    intents:
      - ONCHAIN_TX_LOOKUP_GENERAL
    params:
      query:
        required:
          - name: tx_hash
            type: string
            intents: ["ONCHAIN_TX_LOOKUP_GENERAL"]
            description: Complete 0x-prefixed 64-hex-character transaction hash.
          - name: chain
            type: string
            intents: ["ONCHAIN_TX_LOOKUP_GENERAL"]
            description: >-
              EVM chain name, lower case: ethereum, base, arbitrum, optimism,
              polygon, sepolia or base-sepolia. Ethereum mainnet may also be
              written eth or mainnet.

  - path: /v1/filings
    external_path: /v1/filings
    method: GET
    description: >-
      Counts a company's filings on SEC EDGAR (data.sec.gov submissions,
      by filing date) in a period, optionally of one exact EDGAR form type,
      and returns entity, form_type, filing_count, the filing titles newest first,
      their URLs and a SHA-256 receipt. Use for questions such as "How many
      Form 10-Q filings by Tesla, Inc. (CIK 1318605) in calendar 2023 are on
      SEC EDGAR?". SEC EDGAR only: an unknown or ambiguous company or form
      is refused (422), never answered from another source or with an
      unfiltered count.
    intents:
      - REGULATORY_FILING_MONITOR_GENERAL
    params:
      query:
        required:
          - name: entity
            type: string
            intents: ["REGULATORY_FILING_MONITOR_GENERAL"]
            description: >-
              The subject of the question verbatim, including any SEC form
              type and CIK, e.g. "Form 10-Q filings by Tesla, Inc. (CIK
              1318605)", "Tesla, Inc.", "TSLA", "1318605".
          - name: period
            type: string
            intents: ["REGULATORY_FILING_MONITOR_GENERAL"]
            description: Search period such as last 12 months, 2026, calendar 2023, or YYYY-MM-DD..YYYY-MM-DD. Calendar years only; fiscal-year periods are rejected.
        optional:
          - name: form_type
            type: string
            intents: ["REGULATORY_FILING_MONITOR_GENERAL"]
            description: One SEC EDGAR form type exactly as asked, e.g. 10-K, 10-Q, 8-K, 144/A, 4/A. Exact match (10-K counts originals only; 10-K/A counts amendments only). Omit to count all forms.

  - path: /v1/tvl
    external_path: /v1/tvl
    method: GET
    description: >-
      Returns the current total value locked of a DeFi protocol or chain
      from DeFiLlama's keyless API: protocol_or_chain, tvl_usd,
      chain_tvl_usd, as_of and a SHA-256 receipt. Use for questions such as
      "What is the total value locked in Aave V3, in US dollars?".
    intents:
      - TVL_LOOKUP_GENERAL
    params:
      query:
        required:
          - name: protocol
            type: string
            intents: ["TVL_LOOKUP_GENERAL"]
            description: >-
              DeFi protocol name or DeFiLlama slug, keeping the version when
              one is named (Aave V3 or aave-v3, Uniswap V3 or uniswap-v3,
              Lido), or a chain name (ethereum). At most 512 characters.

  - path: /v1/route
    external_path: /v1/route
    method: GET
    description: >-
      Returns a block-pinned Ethereum mainnet execution quote for selling
      exactly 1 ETH for USDC, the best quote across Uniswap V2/V3, SushiSwap V2,
      as amount_out in USDC base units (6 decimals) with a SHA-256 receipt.
    intents:
      - OPTIMAL_EXECUTION_ROUTE_GENERAL
    params:
      query:
        required:
          - name: pair
            type: string
            intents: ["OPTIMAL_EXECUTION_ROUTE_GENERAL"]
            description: The swap to route. Only ETH/USDC (sell exactly 1 ETH for USDC on Ethereum mainnet).
            accepted_fields:
              ETH/USDC:
                intents: ["OPTIMAL_EXECUTION_ROUTE_GENERAL"]
                description: Sell exactly 1 ETH for USDC on Ethereum mainnet.

  - path: /v1/grid-price
    external_path: /v1/grid-price
    method: GET
    description: >-
      Returns the wholesale electricity price lmp_usd_per_mwh for one
      pricing node or zone and one finished settlement interval, from
      official public feeds: CAISO OASIS day-ahead hourly LMP, NYISO
      real-time 5-minute zonal LBMP, and the Elering dashboard API
      15-minute prices (EUR/MWh converted to USD with the open.er-api.com
      EUR rate). Returns node_or_zone, market, interval_start, currency and
      a SHA-256 receipt. Any other node or zone is refused (422). Use for
      questions such as "What is the CAISO day-ahead LMP for settlement
      interval 2026-09-13T14:00:00Z?".
    intents:
      - GRID_POWER_PRICE_GENERAL
    params:
      query:
        required:
          - name: node_or_zone
            type: string
            intents: ["GRID_POWER_PRICE_GENERAL"]
            description: >-
              Exactly one of: CAISO hubs TH_NP15_GEN-APND, TH_SP15_GEN-APND,
              TH_ZP26_GEN-APND (short names NP15, SP15, ZP26 also accepted),
              or CAISO when no CAISO node is named (answered for the NP15
              trading hub TH_NP15_GEN-APND, as the answer states); NYISO
              zones ZONE_A to ZONE_K (NYISO names such as N.Y.C. also
              accepted); Elering zones EE, FI, LV, LT.
          - name: interval_start
            type: string
            intents: ["GRID_POWER_PRICE_GENERAL"]
            description: >-
              Start of the settlement interval, ISO-8601 UTC, e.g.
              2026-09-13T14:00:00Z.

  - path: /v1/validator
    external_path: /v1/validator
    method: GET
    description: >-
      Returns the effective balance in gwei of one Ethereum beacon-chain
      validator at the finalized state, read from four independently
      operated public beacon APIs (2-of-4 quorum): answered only when at
      least two sources agree on effective_balance and status; fewer than
      two agreeing sources, or any source that disagrees, fails closed
      (502, no answer). Returns validator_index, effective_balance, status
      and a SHA-256 receipt. Use for questions such as "What is the
      effective balance of Ethereum validator index 1, in gwei?".
    intents:
      - VALIDATOR_PERFORMANCE_VERIFY_GENERAL
    params:
      query:
        required:
          - name: validator_index
            type: string
            intents: ["VALIDATOR_PERFORMANCE_VERIFY_GENERAL"]
            description: >-
              Ethereum beacon-chain validator index as a canonical decimal
              digit string (0, or a non-negative integer with no sign and no
              leading zeros), e.g. 1, at most 1000000000 (the official
              intent max). The handler rejects any other shape.

  - path: /v1/gas-price
    external_path: /v1/gas-price
    method: GET
    description: Returns current gas_price_gwei on an explicitly named supported EVM chain from public RPC
      quorum, with stored source evidence.
    intents:
    - GAS_PRICE_GENERAL
    params:
      query:
        required:
        - name: chain
          type: string
          intents:
          - GAS_PRICE_GENERAL
          description: Copy the requested chain without inventing or silently defaulting identity or scope.
  - path: /v1/balance
    external_path: /v1/balance
    method: GET
    description: Returns a finalized native or ERC20 balance in whole token units for an explicit address
      and supported chain. Optional token selects the asset; absent token means the native asset. No transaction
      is sent.
    intents:
    - WALLET_BALANCE_CHECK_GENERAL
    params:
      query:
        required:
        - name: address
          type: string
          intents:
          - WALLET_BALANCE_CHECK_GENERAL
          description: Copy the requested address without inventing or silently defaulting identity or scope.
        - name: chain
          type: string
          intents:
          - WALLET_BALANCE_CHECK_GENERAL
          description: Copy the requested chain without inventing or silently defaulting identity or scope.
        optional:
        - name: token
          type: string
          intents:
          - WALLET_BALANCE_CHECK_GENERAL
          description: Copy the requested token without inventing or silently defaulting identity or scope.
  - path: /v1/token-supply
    external_path: /v1/token-supply
    method: GET
    description: Returns ERC20 total_supply in whole tokens from finalized-tag RPC quorum. The token text
      must preserve explicit chain and contract identity, for example a token followed by on and the named
      chain. Does not infer a chain for an ambiguous symbol.
    intents:
    - TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL
    params:
      query:
        required:
        - name: token
          type: string
          intents:
          - TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL
          description: Copy the complete token string, keeping any explicit chain, contract address and
            display label. Do not invent a chain.
  - path: /v1/macro
    external_path: /v1/macro
    method: GET
    description: Returns World Bank SL.UEM.TOTL.ZS unemployment rate_pct for a country and optional calendar
      year. Omitted year uses latest published nonempty annual data; missing explicit-year data is refused.
      Other economic indicators are not supported.
    intents:
    - MACRO_ECONOMIC_INDICATOR_GENERAL
    params:
      query:
        required:
        - name: indicator
          type: string
          intents:
          - MACRO_ECONOMIC_INDICATOR_GENERAL
          description: Copy the requested indicator without inventing or silently defaulting identity or
            scope.
          accepted_fields:
          - value: unemployment rate
            intents:
            - MACRO_ECONOMIC_INDICATOR_GENERAL
            description: Supported canonical value.
        - name: country
          type: string
          intents:
          - MACRO_ECONOMIC_INDICATOR_GENERAL
          description: Copy the requested country without inventing or silently defaulting identity or scope.
        optional:
        - name: year
          type: integer
          intents:
          - MACRO_ECONOMIC_INDICATOR_GENERAL
          description: Optional explicit calendar year. Preserve the requested year; omit only when no year
            was requested.
  - path: /v1/dns
    external_path: /v1/dns
    method: GET
    description: Returns has_record for one DNS name and one of the ten declared record types from recursive
      resolver observations. Inconclusive failures and existence disagreement are refused, not reported
      as absence.
    intents:
    - DNS_RECORD_LOOKUP_GENERAL
    params:
      query:
        required:
        - name: name
          type: string
          intents:
          - DNS_RECORD_LOOKUP_GENERAL
          description: Copy the requested name without inventing or silently defaulting identity or scope.
        - name: record_type
          type: string
          intents:
          - DNS_RECORD_LOOKUP_GENERAL
          description: Copy the requested record_type without inventing or silently defaulting identity
            or scope.
          accepted_fields:
          - value: A
            intents:
            - DNS_RECORD_LOOKUP_GENERAL
            description: Supported canonical value.
          - value: AAAA
            intents:
            - DNS_RECORD_LOOKUP_GENERAL
            description: Supported canonical value.
          - value: CNAME
            intents:
            - DNS_RECORD_LOOKUP_GENERAL
            description: Supported canonical value.
          - value: MX
            intents:
            - DNS_RECORD_LOOKUP_GENERAL
            description: Supported canonical value.
          - value: NS
            intents:
            - DNS_RECORD_LOOKUP_GENERAL
            description: Supported canonical value.
          - value: TXT
            intents:
            - DNS_RECORD_LOOKUP_GENERAL
            description: Supported canonical value.
          - value: SOA
            intents:
            - DNS_RECORD_LOOKUP_GENERAL
            description: Supported canonical value.
          - value: CAA
            intents:
            - DNS_RECORD_LOOKUP_GENERAL
            description: Supported canonical value.
          - value: SRV
            intents:
            - DNS_RECORD_LOOKUP_GENERAL
            description: Supported canonical value.
          - value: PTR
            intents:
            - DNS_RECORD_LOOKUP_GENERAL
            description: Supported canonical value.
  - path: /v1/fx
    external_path: /v1/fx
    method: GET
    description: Returns converted_amount in the requested to_currency using dated daily public rate sources
      and disclosed agreement or degraded coverage, not a live trading quote.
    intents:
    - CURRENCY_EXCHANGE_CONVERT
    params:
      query:
        required:
        - name: from_currency
          type: string
          intents:
          - CURRENCY_EXCHANGE_CONVERT
          description: Copy the requested from_currency without inventing or silently defaulting identity
            or scope.
        - name: to_currency
          type: string
          intents:
          - CURRENCY_EXCHANGE_CONVERT
          description: Copy the requested to_currency without inventing or silently defaulting identity
            or scope.
        optional:
        - name: amount
          type: number
          intents:
          - CURRENCY_EXCHANGE_CONVERT
          description: Copy the requested amount without inventing or silently defaulting identity or scope.
  - path: /v1/ssl
    external_path: /v1/ssl
    method: GET
    description: Returns certificate_valid from an actual TLS certificate and hostname/trust-store check
      on an allowed public hostname. Network failure is refused. No revocation or multi-vantage assurance
      is claimed.
    intents:
    - SSL_VERIFICATION_CERT
    params:
      query:
        required:
        - name: host
          type: string
          intents:
          - SSL_VERIFICATION_CERT
          description: Copy the requested host without inventing or silently defaulting identity or scope.
  - path: /v1/email-security
    external_path: /v1/email-security
    method: GET
    description: Returns lookup_ok for a public DNS response status for one domain/name and record type.
      It does not report record presence, email safety or deliverability; NOERROR can have no matching records.
    intents:
    - EMAIL_SECURITY_GENERAL
    params:
      query:
        required:
        - name: domain
          type: string
          intents:
          - EMAIL_SECURITY_GENERAL
          description: Copy the requested domain without inventing or silently defaulting identity or scope.
        - name: record_type
          type: string
          intents:
          - EMAIL_SECURITY_GENERAL
          description: Copy the requested record_type without inventing or silently defaulting identity
            or scope.

intent_mapping:
  ONCHAIN_TX_LOOKUP_GENERAL:
    endpoint: /v1/tx
    input:
      tx_hash:
        from: tx_hash
      chain:
        from: chain
    output:
      tx_hash:
        path: tx_hash
      status:
        path: status
      from:
        path: from
      to:
        path: to
      block_number:
        path: block_number
        unit: "block height"
      value_eth:
        path: value_eth
        unit: "whole native units"

  REGULATORY_FILING_MONITOR_GENERAL:
    endpoint: /v1/filings
    input:
      entity:
        from: entity
        how: "Copy the subject of the question verbatim, including any SEC form type and CIK (e.g. 'Form 10-Q filings by Tesla, Inc. (CIK 1318605)')."
      period:
        from: period
        how: "Pass the requested time period verbatim (e.g., last 12 months, 2026, calendar 2023)."
      form_type:
        from: entity
        how: "Only the SEC EDGAR form type the request names, exactly as EDGAR writes it (10-K, 10-Q, 8-K, 144/A). Leave empty when no form type is named."
    output:
      entity:
        path: entity
      filing_count:
        path: filing_count
        unit: "filings"
      filings:
        path: filings
      urls:
        path: urls

  TVL_LOOKUP_GENERAL:
    endpoint: /v1/tvl
    input:
      protocol:
        from: protocol
        how: "The protocol or chain name as asked, keeping any version (Aave V3, Uniswap V3), without extra words."
    output:
      protocol_or_chain:
        path: protocol_or_chain
      tvl_usd:
        path: tvl_usd
        unit: "USD"
      chain_tvl_usd:
        path: chain_tvl_usd
        unit: "USD"
      as_of:
        path: as_of

  OPTIMAL_EXECUTION_ROUTE_GENERAL:
    endpoint: /v1/route
    input:
      pair:
        from: pair
    output:
      amount_out:
        path: amount_out
        unit: "USDC base units (6 decimals)"

  GRID_POWER_PRICE_GENERAL:
    endpoint: /v1/grid-price
    input:
      node_or_zone:
        from: node_or_zone
        how: "The exact node or zone identifier named; CAISO when the request names CAISO without a node."
      interval_start:
        from: interval_start
        how: "ISO-8601 UTC datetime, e.g. 2026-09-13T14:00:00Z."
    output:
      lmp_usd_per_mwh:
        path: lmp_usd_per_mwh
        unit: "USD per MWh"
      node_or_zone:
        path: node_or_zone
      market:
        path: market
      interval_start:
        path: interval_start
      currency:
        path: currency

  VALIDATOR_PERFORMANCE_VERIFY_GENERAL:
    endpoint: /v1/validator
    input:
      validator_index:
        from: validator_index
    output:
      effective_balance:
        path: effective_balance
        unit: "gwei"

  GAS_PRICE_GENERAL:
    endpoint: /v1/gas-price
    input:
      chain:
        from: chain
    output:
      chain:
        path: chain
      gas_price_gwei:
        path: gas_price_gwei
        unit: gwei
      as_of:
        path: as_of
  WALLET_BALANCE_CHECK_GENERAL:
    endpoint: /v1/balance
    input:
      address:
        from: address
      chain:
        from: chain
      token:
        from: token
    output:
      address:
        path: address
      chain:
        path: chain
      balance:
        path: balance
        unit: whole token units
      token_symbol:
        path: token_symbol
      as_of:
        path: as_of
  TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL:
    endpoint: /v1/token-supply
    input:
      token:
        from: token
        how: Preserve explicit contract, display label and chain context verbatim; do not silently discard
          a conflicting identity or assume a chain.
    output:
      total_supply:
        path: total_supply
        unit: whole tokens
  MACRO_ECONOMIC_INDICATOR_GENERAL:
    endpoint: /v1/macro
    input:
      indicator:
        from: indicator
      country:
        from: country
      year:
        from: year
    output:
      rate_pct:
        path: rate_pct
        unit: percent
  DNS_RECORD_LOOKUP_GENERAL:
    endpoint: /v1/dns
    input:
      name:
        from: name
      record_type:
        from: record_type
    output:
      has_record:
        path: has_record
  CURRENCY_EXCHANGE_CONVERT:
    endpoint: /v1/fx
    input:
      from_currency:
        from: from_currency
      to_currency:
        from: to_currency
      amount:
        from: amount
    output:
      converted_amount:
        path: converted_amount
  SSL_VERIFICATION_CERT:
    endpoint: /v1/ssl
    input:
      host:
        from: host
    output:
      certificate_valid:
        path: certificate_valid
  EMAIL_SECURITY_GENERAL:
    endpoint: /v1/email-security
    input:
      domain:
        from: domain
      record_type:
        from: record_type
    output:
      lookup_ok:
        path: lookup_ok
