version: "1"
kind: miner
protocol: generic
id: 774921
slug: verireceipt
name: VeriReceipt Deterministic Oracle
description: >-
  Zero-LLM, cryptographically receipted deterministic provider for on-chain
  transactions, SEC/Federal Register filings, DeFi TVL, block-pinned ETH/USDC
  execution routing, and wholesale grid power prices. Every answer includes a
  verifiable source hash and fails closed rather than guessing.
base_url: https://verireceipt.onrender.com

auth:
  type: none

cache_ttl_sec: 10
rate_limit_per_sec: 20
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  website: https://verireceipt.onrender.com
  documentation: https://verireceipt.onrender.com/docs
  repository: https://github.com/mohamedwael201193/verireceipt

limitations:
  - code: MAX_PARAM_SIZE
    message: Input parameter length must not exceed 512 characters.
    param: entity
    property: length
    value_num: 512
    operator: lte

semantics:
  supported_intents:
    - ONCHAIN_TX_LOOKUP_GENERAL
    - REGULATORY_FILING_MONITOR_GENERAL
    - TVL_LOOKUP_GENERAL
    - OPTIMAL_EXECUTION_ROUTE_GENERAL
    - GRID_POWER_PRICE_GENERAL
  signal_mapping:
    confidence_field: confidence
    label_field: verdict
    reason_field: source

endpoints:
  - path: /v1/tx
    external_path: /v1/tx
    method: GET
    description: >-
      Looks up an EVM transaction hash on a specified chain using a 2-of-3
      archive-RPC quorum (including OP-stack L1 data fee) and returns exact
      tx_hash, status, from, to, block_number, value_eth, and a SHA-256 receipt.
    intents:
      - ONCHAIN_TX_LOOKUP_GENERAL
    params:
      query:
        required:
          - name: tx_hash
            type: string
            intents: ["ONCHAIN_TX_LOOKUP_GENERAL"]
            description: Complete 0x-prefixed 64-hex-character transaction hash.
          - name: chain
            type: string
            intents: ["ONCHAIN_TX_LOOKUP_GENERAL"]
            description: EVM chain name (ethereum, base, arbitrum, optimism, polygon, sepolia).

  - path: /v1/filings
    external_path: /v1/filings
    method: GET
    description: >-
      Queries SEC EDGAR Submissions API and Federal Register API for an entity
      over a specified period and returns entity, filing_count, filings list,
      urls list, and a SHA-256 receipt.
    intents:
      - REGULATORY_FILING_MONITOR_GENERAL
    params:
      query:
        required:
          - name: entity
            type: string
            intents: ["REGULATORY_FILING_MONITOR_GENERAL"]
            description: Company name, ticker symbol, CIK, or federal agency.
          - name: period
            type: string
            intents: ["REGULATORY_FILING_MONITOR_GENERAL"]
            description: Search period such as last 12 months, 2026, or YYYY-MM-DD..YYYY-MM-DD.

  - path: /v1/tvl
    external_path: /v1/tvl
    method: GET
    description: >-
      Queries DeFiLlama keyless APIs with protocol normalization and returns
      protocol_or_chain, tvl_usd, chain_tvl_usd, as_of timestamp, and a SHA-256 receipt.
    intents:
      - TVL_LOOKUP_GENERAL
    params:
      query:
        required:
          - name: protocol
            type: string
            intents: ["TVL_LOOKUP_GENERAL"]
            description: DeFi protocol slug/name or blockchain name (e.g., aave-v3, uniswap, ethereum).

  - path: /v1/route
    external_path: /v1/route
    method: GET
    description: >-
      Returns block-pinned Ethereum mainnet execution quote (amount_out in
      6-decimal USDC base units) for selling exactly 1 ETH for USDC across
      Uniswap V2/V3, SushiSwap V2, and Curve pools with a SHA-256 receipt.
    intents:
      - OPTIMAL_EXECUTION_ROUTE_GENERAL
    params:
      query:
        required:
          # pair is declared as type string: the miner-config param types are
          # only string/integer/number/boolean/array/object (no enum type).
          # Live registered OPTIMAL miners declare pair as type string with
          # enum ["ETH/USDC"] in their input_schema; the enum is expressed
          # here in the description instead.
          - name: pair
            type: string
            intents: ["OPTIMAL_EXECUTION_ROUTE_GENERAL"]
            description: Must be ETH/USDC (sell exactly 1 ETH for USDC on Ethereum mainnet).

  - path: /v1/grid-price
    external_path: /v1/grid-price
    method: GET
    description: >-
      Returns wholesale electricity locational marginal price (lmp_usd_per_mwh)
      from official public ISO feeds (CAISO, ERCOT, NYISO, MISO, ENTSO-E/Elering)
      for a node_or_zone and interval_start datetime with a SHA-256 receipt.
    intents:
      - GRID_POWER_PRICE_GENERAL
    params:
      query:
        required:
          - name: node_or_zone
            type: string
            intents: ["GRID_POWER_PRICE_GENERAL"]
            description: Pricing node or bidding zone (e.g., TH_NP15_GEN-APND, HB_NORTH, ZONE_J).
          - name: interval_start
            type: string
            intents: ["GRID_POWER_PRICE_GENERAL"]
            description: ISO-8601 UTC start datetime of the settlement interval.

intent_mapping:
  ONCHAIN_TX_LOOKUP_GENERAL:
    endpoint: /v1/tx
    input:
      tx_hash:
        from: tx_hash
        how: "Copy the complete 0x-prefixed 64-hex-character transaction hash verbatim."
      chain:
        from: chain
        how: "Normalize chain name to lowercase (ethereum, base, arbitrum, optimism, polygon, sepolia)."
    output:
      tx_hash:
        path: tx_hash
      status:
        path: status
      from:
        path: from
      to:
        path: to
      block_number:
        path: block_number
        unit: "block height"
      value_eth:
        path: value_eth
        unit: "whole native units"

  REGULATORY_FILING_MONITOR_GENERAL:
    endpoint: /v1/filings
    input:
      entity:
        from: entity
        how: "Pass the exact company name, ticker, CIK, or agency requested."
      period:
        from: period
        how: "Pass the requested time period verbatim (e.g., last 12 months, 2026)."
    output:
      entity:
        path: entity
      filing_count:
        path: filing_count
        unit: "filings"
      filings:
        path: filings
      urls:
        path: urls

  TVL_LOOKUP_GENERAL:
    endpoint: /v1/tvl
    input:
      protocol:
        from: protocol
        how: "Pass the DeFi protocol or chain name cleanly without extra prose."
    output:
      protocol_or_chain:
        path: protocol_or_chain
      tvl_usd:
        path: tvl_usd
        unit: "USD"
      chain_tvl_usd:
        path: chain_tvl_usd
        unit: "USD"
      as_of:
        path: as_of

  OPTIMAL_EXECUTION_ROUTE_GENERAL:
    endpoint: /v1/route
    input:
      pair:
        from: pair
        how: "Must be ETH/USDC."
    output:
      amount_out:
        path: amount_out
        unit: "USDC base units (6 decimals)"

  GRID_POWER_PRICE_GENERAL:
    endpoint: /v1/grid-price
    input:
      node_or_zone:
        from: node_or_zone
        how: "Extract the exact pricing node or bidding zone identifier."
      interval_start:
        from: interval_start
        how: "Format settlement interval start as ISO-8601 UTC datetime."
    output:
      lmp_usd_per_mwh:
        path: lmp_usd_per_mwh
        unit: "USD per MWh"
      node_or_zone:
        path: node_or_zone
      market:
        path: market
      interval_start:
        path: interval_start
      currency:
        path: currency
