services:
  - type: web
    name: verireceipt
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    disk:
      name: verireceipt-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: PORT
        value: "10000"
      - key: SQLITE_PATH
        value: /var/data/verireceipt.sqlite
      - key: TELEGRAPH_NODE_URL
        value: https://devnode.telegraphprotocol.com
      - key: TELEGRAPH_DIAMOND
        value: "0x72a70e949362670Bf8bceAd24eFC5b8f950aa08b"
      - key: DESK_DAILY_SPEND_CAP_USD
        value: "2.00"
      - key: DESK_FREE_CHECKS_PER_IP_DAY
        value: "5"
      # Secrets are set in the Render Dashboard only — never in this file.
      - key: DESK_PAYER_PRIVATE_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
