<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VeriReceipt — Zero-LLM Receipt Oracle & Mission 13/12 Desk. Deterministic, cryptographically receipted answers for on-chain transactions, SEC filings, DeFi TVL, ETH/USDC execution routing, and grid power prices."
    />
    <title>VeriReceipt — Zero-LLM Receipt Oracle &amp; Mission 13/12 Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted theme before first paint (dark is the default).
      try {
        var t = localStorage.getItem("verireceipt-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
